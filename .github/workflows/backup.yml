name: Nightly Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Verify pg_dump version
        run: pg_dump --version

      - name: Validate connection string (fail fast if wrong pooler)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if echo "$SUPABASE_DB_URL" | grep -qE 'db\..*\.supabase\.co'; then
            echo "ERROR: Direct connection detected. Use the Session Pooler string instead."
            exit 1
          fi
          if echo "$SUPABASE_DB_URL" | grep -q ':6543'; then
            echo "ERROR: Transaction pooler detected. Use the Session Pooler (port 5432)."
            exit 1
          fi
          echo "Connection string looks correct (Session Pooler)."

      - name: Dump database to custom-format archive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DUMP_FILE="backup-$(date +%Y%m%d-%H%M).dump"
          echo "Dumping to $DUMP_FILE..."
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --compress=6 \
            --no-sync \
            --file="$DUMP_FILE"
          echo "DUMP_FILE=$DUMP_FILE" >> $GITHUB_ENV
          ls -lh "$DUMP_FILE"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp "$DUMP_FILE" \
            "s3://${R2_BUCKET}/daily-backups/${DUMP_FILE}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          echo "Uploaded $DUMP_FILE to R2."

      - name: Notify on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ SSCMPS nightly backup FAILED. Check GitHub Actions logs."
          fi