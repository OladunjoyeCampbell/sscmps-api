name: Keep Supabase Alive

on:
  schedule:
    # Daily at 06:00 UTC — well inside Supabase's 7-day free-tier pause window
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$REF" ] || [ -z "$ANON" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF or SUPABASE_ANON_KEY secrets"
            exit 1
          fi

          echo "Pinging Supabase project ${REF}..."

          curl -sS -X GET "https://${REF}.supabase.co/rest/v1/loan_products?select=id&limit=1" \
               -H "apikey: ${ANON}" \
               -H "Authorization: Bearer ${ANON}" \
               --fail --retry 3 --retry-delay 5 --max-time 15

          echo
          echo "✅ Supabase database is awake."